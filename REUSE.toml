version = 1
SPDX-PackageName = "parking-app"
SPDX-PackageSupplier = "NOI Techpark <digital@noi.bz.it>"
SPDX-PackageDownloadLocation = "https://github.com/noi-techpark/parking-app"

[[annotations]]
path = [".github/**", ".gitignore", ".pre-commit-config.yaml", ".yarnrc", "LICENSE.md", ".editorconfig", ".prettierrc", "**.png", "**.svg", "**.json", "**.ico", "yarn.lock", "public/matomo.js"]
precedence = "aggregate"
SPDX-FileCopyrightText = "(c) NOI Techpark <digital@noi.bz.it>"
SPDX-License-Identifier = "CC0-1.0"

# Generated by `yarn geo:build` from OpenStreetMap administrative boundaries.
# A derived database of OSM data, so it carries OSM's own licence rather than
# the project's. Must be listed after the broad rule above to take precedence.
[[annotations]]
path = ["src/assets/data/municipalities.topo.json", "src/assets/data/municipalities.index.json", "src/assets/data/municipalities.overrides.json"]
precedence = "override"
SPDX-FileCopyrightText = "(c) OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"
