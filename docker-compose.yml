services:
  app:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
    command: sh -c "yarn install --ignore-engines && yarn dev"
