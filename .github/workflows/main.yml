name: CI/CD

on:
  push:
  pull_request:

env:
  NODE_VERSION: 22.x
  AWS_REGION : "eu-west-1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: noi-techpark/github-actions/checkout@v2

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5

      - uses: noi-techpark/github-actions/yarn-build@v2
        with:
          node-version: ${{env.NODE_VERSION}}

      # yarn-build has already installed dependencies and set up node.
      - name: Unit tests
        run: yarn test

      - name: Lint
        run: yarn lint

      # Everything above tests source through Vite's transform. This runs the
      # artefact that actually gets published.
      - name: Verify built bundle
        run: yarn verify:bundle

      - name: Test Webcomponent
        uses: noi-techpark/github-actions/webcomp-test@v2
        with:
          origin-test-directory: src

  # https://parking.opendatahub.testingmachine.eu
  deploy-test:
    runs-on: ubuntu-24.04
    # TEMPORARY: feat/parking-v2 is here so the rebuild can be exercised on the
    # test site before it reaches main. Remove the branch once it is merged.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/parking-v2'
    needs: test
    concurrency: deploy-test
    env:
      AWS_S3_BUCKET_NAME: 'com.opendatahub.parking-test'
      MATOMO: true
      ENVIRONMENT: test
      # The standalone site owns its URL, so it mirrors filters into it.
      STANDALONE: true
    steps:
      - uses: noi-techpark/github-actions/checkout@v2

      - uses: noi-techpark/github-actions/yarn-build@v2
        with:
          build-command: yarn build
          node-version: ${{env.NODE_VERSION}}

      - name: Sync to S3 bucket
        uses: noi-techpark/github-actions/aws-s3-bucket-sync@v2
        with:
          access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          region: ${{ env.AWS_REGION }}
          s3-bucket-name: ${{ env.AWS_S3_BUCKET_NAME }}
          folder: ./dist

  # https://parking.opendatahub.com
  # https://parking.bz.it
  deploy-prod:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/prod'
    needs: test
    concurrency: deploy-prod
    env:
      AWS_S3_BUCKET_NAME: 'com.opendatahub.parking-prod'
      MATOMO: true
      STANDALONE: true
    steps:
      - uses: noi-techpark/github-actions/checkout@v2

      - uses: noi-techpark/github-actions/yarn-build@v2
        with:
          build-command: yarn build
          node-version: ${{env.NODE_VERSION}}

      - name: Sync to S3 bucket
        uses: noi-techpark/github-actions/aws-s3-bucket-sync@v2
        with:
          access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          region: ${{ env.AWS_REGION }}
          s3-bucket-name: ${{ env.AWS_S3_BUCKET_NAME }}
          folder: ./dist

  # webcomponent
  deploy-webcomponent-test:
    runs-on: ubuntu-24.04
    # TEMPORARY: see deploy-test above. Remove once merged to main.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/parking-v2'
    needs: test
    concurrency: deploy-webcomponent-test
    env:
      MATOMO: false
    steps:
      - uses: noi-techpark/github-actions/checkout@v2

      - uses: noi-techpark/github-actions/yarn-build@v2
        with:
          build-command: yarn build
          node-version: ${{env.NODE_VERSION}}

      - uses: noi-techpark/github-actions/webcomp-push@v2
        with:
          keycloak-secret: ${{secrets.WCSTORE_CLI_KEYCLOAK_SECRET_TEST}}
          version-tag: ${{github.sha}}

  deploy-webcomponent-prod:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    concurrency: deploy-webcomponent-prod
    env:
      MATOMO: false
    steps:
      - uses: noi-techpark/github-actions/checkout@v2

      - uses: noi-techpark/github-actions/yarn-build@v2
        with:
          build-command: yarn build
          node-version: ${{env.NODE_VERSION}}

      - uses: noi-techpark/github-actions/webcomp-push@v2
        with:
          keycloak-secret: ${{secrets.WCSTORE_CLI_KEYCLOAK_SECRET_PROD}}
          version-tag: ${{github.ref_name}}
          production: "true"
