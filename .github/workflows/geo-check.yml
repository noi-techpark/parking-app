# The bundled municipality boundaries are generated by `yarn geo:build` and
# committed; they are never rebuilt during a normal build, because that would
# make every deploy depend on the Overpass API.
#
# The cost of that choice is silent staleness: a parking appearing somewhere the
# prune never reached simply renders with no municipality. This job is what makes
# that visible, on its own schedule, where a failure means "the data moved"
# rather than "your PR is broken".
name: Municipality coverage

on:
  schedule:
    # Monday morning, before the week's work.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  geo-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: noi-techpark/github-actions/checkout@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Check bundled boundaries still cover every live parking
        run: yarn geo:check
